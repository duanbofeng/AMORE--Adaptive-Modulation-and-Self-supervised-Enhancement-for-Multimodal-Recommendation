# Conservative compact AMORE. Fixed-full controls override the auxiliary weights.
embedding_size: 64
learning_rate_scheduler:
- 0.96
- 50
learning_rate: 0.001
reg_weight_1: 1.0e-05
reg_weight_2: 0.0
knn_k: 10
n_ui_layers: 3
n_layers: 2
bm_loss: 0.005
bm_temp: 0.4
um_loss: 0.0
um_temp: 0.4
vt_loss: 0.1
use_affinity_modulation: true
affinity_threshold: '>0.1'
affinity_reattn: true
use_adaptive_bpr: false
adaptive_weight_smooth: 0.5
graph_chunk_size: 512
edge_chunk_size: 32768
hyper_parameters:
- seed
bm_extended_loss: 0.0
noise_loss: 0.0
coarse_affinity: false
