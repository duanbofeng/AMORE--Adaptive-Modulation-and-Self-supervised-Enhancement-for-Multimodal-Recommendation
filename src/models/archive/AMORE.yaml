# PAMD模块参数（用于消融实验）
use_pamd: True  # 是否启用PAMD模块
pamd_loss_weight: 1e-2 # PAMD对比损失的权重（建议范围：0.5-2.0，可根据效果调整）
pamd_recon_loss_type: 'mse'  # 兼容字段，当前使用对比损失
pamd_temp: 0.2  # PAMD对比损失的温度超参

# EgoGCN-style Affinity-based Hard Modulation 参数
use_affinity_modulation: True # 是否启用基于亲和度的硬调制机制

affinity_reattn: True  # 是否在调制后重新计算注意力（类似EgoGCN的reattn机制）

use_adaptive_bpr: False
adaptive_weight_smooth: 0.5

fine_grained_weight: 0.5
affinity_decouple_weight: 0.3  # 亲和度对粗粒度权重的轻量调节(0=关闭)